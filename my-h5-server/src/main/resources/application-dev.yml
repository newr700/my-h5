# 开发环境配置：本机 MySQL + 打开接口文档
#
# ── 数据源 ───────────────────────────────────────────────────
# 连接串三段式：jdbc:mysql://主机:端口/库名?参数
#   useSSL=false        本地开发不加密（生产要开）
#   serverTimezone      不显式指定时区，MySQL 驱动和 JVM 时区不一致会导致
#                       存进去的时间差 8 小时 —— 经典坑，几乎每个 Java 新手都踩过
#   characterEncoding   填的是【Java 字符集名】，只能写 UTF-8！
#                       写 utf8mb4 会被 Connector/J 9.x 拒（Unsupported character encoding），
#                       utf8mb4 是 MySQL 侧的字符集，由建库语句保证，与这个参数无关 ——
#                       这是 Connector/J 8 → 9 升级最容易踩的坑（本项目实际踩过一次）
#   allowPublicKeyRetrieval  MySQL 8  caching_sha2_password 认证在非 SSL 连接下需要它
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/my_h5?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    # 开发密码可以明文放本地配置，但生产密码必须走环境变量（见 application-prod.yml）。
    # 团队项目里更严格的做法是这份文件也不入库（.gitignore + 提供 template），
    # 我们两人小项目从简，但你要知道正规军怎么干
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Flyway：启动时自动执行 db/migration 下的 V*.sql。
  # 它会建一张 flyway_schema_history 表记录哪些迁移跑过了 ——
  # 所以同一个迁移脚本绝不会跑第二遍，改已执行的脚本会直接启动失败（故意的，防篡改）
  flyway:
    enabled: true
    locations: classpath:db/migration

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
